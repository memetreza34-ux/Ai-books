name: Test and quality checks
on:
  push:
  pull_request:
jobs:
  test-and-example-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev,preview]'
      - name: Test
        run: python -m pytest
      - name: Build sample draft book
        run: python -m aibooks sudoku --title "Sudoku Testband" --count 28 --seed 20261022 --clues 38 --previews --out output/github-sample
      - name: Score synthetic opportunity example (must remain HOLD)
        run: |
          python -m aibooks evaluate --input examples/opportunities-example.json --out output/github-sample/opportunity-UNVERIFIED.json
          python -c "import json; p=json.load(open('output/github-sample/opportunity-UNVERIFIED.json')); assert p['recommendations'][0]['status']=='HOLD'"
      - name: Upload sample draft and full-page previews
        uses: actions/upload-artifact@v4
        with:
          name: ai-books-sudoku-draft
          path: output/github-sample/
          if-no-files-found: error
          retention-days: 14

  base-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install base + tests only (no preview extra)
        run: python -m pip install -e '.[dev]'
      - name: Run an entire book without optional preview packages
        run: python -m aibooks sudoku --title "Sudoku Basisinstallation" --count 20 --seed 20261022 --clues 40 --out output/minimal-install-smoke
      - name: Verify content gate in base install
        run: |
          python -c "import json; p=json.load(open('output/minimal-install-smoke/quality-report.json')); assert p['editorial']['content_consistency_passed'] and p['preflight']['machine_preflight_passed']"
