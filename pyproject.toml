[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-books-factory"
version = "0.1.0"
description = "Local, testable book-production tools with human publishing gates"
requires-python = ">=3.11"
dependencies = ["reportlab>=4.0,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
preview = ["PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[project.scripts]
aibooks = "aibooks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
